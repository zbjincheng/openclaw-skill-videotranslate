# OpenClaw skill manifest — translation_dubbing_skill
#
# See design.md §"技能入口（Entry）与清单文件（Manifest）" for the schema
# and field semantics. Enumerations, required_when conditions and defaults
# mirror the design exactly so the runtime, the Python entry module and
# the property tests stay in lockstep.
#
# Requirements satisfied:
#   R1.1–R1.8   — manifest declares all input/output fields + processing mode
#   R1.3        — processing_mode enum + default
#   R1.4, R1.6  — translation_/tts_ enum values and required_when conditions
#   R12.3, R12.4 — rate-limit defaults for both adapters

name: video-subtitle-translation-dubbing
version: 0.1.1
description: 英文视频翻译配音技能（English→Chinese subtitle translation and dubbing）
entrypoint:
  module: translation_dubbing_skill
  function: run

inputs:
  video_path:
    type: path
    required: true
    description: 输入视频文件路径（R1.2）
  subtitle_path:
    type: path
    required: false
    description: 可选的外挂字幕文件（.srt / .vtt）；缺失时从视频内嵌英文字幕轨提取
  source_language:
    type: string
    required: true
    default: en
    description: 原始视频字幕语言（如 en, zh-CN, ja 等）（R1.2）
  target_language:
    type: string
    required: true
    default: zh-CN
    description: 目标翻译语言（如 zh-CN, en, ja 等）（R1.2）
  processing_mode:
    type: enum
    values: [subtitle_only, subtitle_and_dubbing]
    required: true
    default: subtitle_and_dubbing
    description: 处理模式（R1.3）。subtitle_only 跳过 TTS 与音频对齐。
  voice_id:
    type: string
    required: false
    description: TTS 语音 id；subtitle_only 模式下被忽略（R1.7）
  translation_provider:
    type: enum
    values: [llm, web]
    required: true
    description: 翻译提供方类型标识（R1.4, R1.12）
  translation_endpoint:
    type: string
    required: true
    description: 翻译提供方 HTTP 端点
  translation_credential:
    type: secret
    required: true
    description: 翻译提供方凭证；错误/日志对象中会被脱敏
  translation_config:
    type: object
    required: false
    description: 翻译提供方自定义配置（如 model_name / language_pair）
  translation_rate_limit:
    type: object
    required: false
    description: 翻译提供方自适应调度配置（R12.3）
    default:
      batch_size_initial: 20
      batch_size_min: 1
      batch_size_max: 50
      payload_size_initial: 4000
      payload_size_min: 500
      payload_size_max: 32000
      payload_unit: tokens
      concurrency_initial: 2
      concurrency_min: 1
      concurrency_max: 8
      max_retries: 5
      backoff_base_ms: 500
      backoff_jitter_ms: 300
      probe_up_every_n_success: 10
      supports_batch: true
  tts_provider:
    type: enum
    values: [llm, web]
    required_when:
      processing_mode: subtitle_and_dubbing
    description: 语音合成提供方类型标识（R1.6, R1.12）；subtitle_only 模式下忽略（R1.7）
  tts_endpoint:
    type: string
    required_when:
      processing_mode: subtitle_and_dubbing
    description: 语音合成提供方 HTTP 端点
  tts_credential:
    type: secret
    required_when:
      processing_mode: subtitle_and_dubbing
    description: 语音合成提供方凭证；脱敏同上
  tts_config:
    type: object
    required: false
    description: 语音合成提供方自定义配置（如 model_name, default_voice）
  tts_rate_limit:
    type: object
    required: false
    description: 语音合成提供方自适应调度配置（R12.4）
    default:
      batch_size_initial: 1
      batch_size_min: 1
      batch_size_max: 16
      payload_size_initial: 1000
      payload_size_min: 200
      payload_size_max: 5000
      payload_unit: chars
      concurrency_initial: 4
      concurrency_min: 1
      concurrency_max: 16
      max_retries: 5
      backoff_base_ms: 500
      backoff_jitter_ms: 300
      probe_up_every_n_success: 10
      supports_batch: false

outputs:
  output_video_path:
    type: path
    description: 合成后的 .mkv 输出视频路径（R9.16）
  output_subtitle_path:
    type: path
    description: 翻译后的中文字幕 UTF-8 文件路径（R9.16）

supported_video_formats: [mp4, mkv, mov, webm]
