[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translation-dubbing-skill"
version = "0.1.3"
description = "OpenClaw skill: translate English video subtitles to Chinese and (optionally) dub Chinese audio into the video."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenClaw" }]
keywords = ["openclaw", "subtitle", "translation", "tts", "dubbing", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
    "pydub>=0.25.1",
    "ffmpeg-python>=0.2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["translation_dubbing_skill*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydub.*",
]
markers = [
    "integration: end-to-end integration tests that may invoke ffmpeg",
    "slow: tests that take noticeable time to run",
]

[tool.hypothesis]
deadline = 1000
max_examples = 100
derandomize = false
