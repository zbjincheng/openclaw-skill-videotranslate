name: Publish Skill to ClawHub

on:
  push:
    tags:
      - 'v*' # Trigger ClawHub publish workflow when pushing version tags like v0.1.3

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish Skill to ClawHub Registry
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          npx clawhub skill publish ./ \
            --slug video-subtitle-translation-dubbing \
            --name "Video Subtitle Translation & Dubbing" \
            --version "${GITHUB_REF#refs/tags/v}"
