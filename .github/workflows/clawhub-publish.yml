name: Publish Skill to ClawHub

on:
  push:
    tags:
      - 'v*' # Trigger ClawHub publish workflow when pushing version tags like v0.1.3

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    with:
      skill_path: '.' # Specify the skill folder path (root directory of repo)
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
